name: Encrypted Supabase backup to Google Drive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      RCLONE_CONFIG_B64: ${{ secrets.BACKUP_RCLONE_CONFIG_B64 }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      DRIVE_FOLDER_ID: ${{ vars.BACKUP_DRIVE_FOLDER_ID }}
    steps:
      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL RCLONE_CONFIG_B64 AGE_RECIPIENT DRIVE_FOLDER_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing configuration: $key"
              exit 1
            fi
          done
      - name: Install backup tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone
      - name: Export, encrypt and upload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$tmpdir/rclone.conf"
          export RCLONE_CONFIG="$tmpdir/rclone.conf"
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          filename="lebenscockpit-$stamp.dump.age"
          # Database connection string must point to the direct or session pooler endpoint.
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e DATABASE_URL \
            -v "$tmpdir:/backup" \
            postgres:17 \
            pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/backup.dump
          test -s "$tmpdir/backup.dump"
          age -r "$AGE_RECIPIENT" -o "$tmpdir/$filename" "$tmpdir/backup.dump"
          test -s "$tmpdir/$filename"
          rclone copyto "$tmpdir/$filename" "drive:$filename" --drive-root-folder-id "$DRIVE_FOLDER_ID" --checkers 2 --transfers 1
          rclone lsf "drive:" --drive-root-folder-id "$DRIVE_FOLDER_ID" | grep -Fx "$filename"
          echo "Encrypted backup uploaded and filename verified."
