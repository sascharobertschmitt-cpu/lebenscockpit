name: Encrypted Supabase backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: encrypted-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [lebenscockpit, reselling-manager]
    env:
      PROJECT: ${{ matrix.project }}
      DB_URL_LEBENSCOCKPIT: ${{ secrets.BACKUP_DB_URL_LEBENSCOCKPIT }}
      DB_URL_RESELLING_MANAGER: ${{ secrets.BACKUP_DB_URL_RESELLING_MANAGER }}
      # Public key only. The private key is stored offline by the owner.
      AGE_RECIPIENT: age1p255cwy2padre3jyg0umynlkkcdpgl2jx4h7hnsta050zuz7zpgsxhw4ah
    steps:
      - name: Select database URL and check configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROJECT" == "lebenscockpit" ]]; then
            url="$DB_URL_LEBENSCOCKPIT"
          else
            url="$DB_URL_RESELLING_MANAGER"
          fi
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          if [[ -z "$url" ]]; then
            echo "::error::Missing database URL secret for $PROJECT"
            exit 1
          fi
      - name: Install backup tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
      - name: Export and encrypt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out work
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          filename="$PROJECT-$stamp.dump.age"
          # Session pooler (IPv4). User: backup_reader.<project-ref>, read-only role.
          # Secret may contain the placeholder HOST; try the eu-central-1 session poolers.
          if [[ "$DATABASE_URL" == *"@HOST:"* ]]; then
            hosts="aws-1-eu-central-1.pooler.supabase.com aws-0-eu-central-1.pooler.supabase.com"
          else
            hosts="keep"
          fi
          ok=0
          for h in $hosts; do
            if [[ "$h" == "keep" ]]; then
              url="$DATABASE_URL"
            else
              url="${DATABASE_URL/@HOST:/@$h:}"
            fi
            echo "::add-mask::$url"
            if docker run --rm --network host \
                --user "$(id -u):$(id -g)" \
                -e PGURL="$url" \
                -v "$PWD/work:/backup" \
                postgres:17 \
                sh -c 'pg_dump --dbname="$PGURL" --format=custom --no-owner --no-acl --no-large-objects --file=/backup/backup.dump'; then
              echo "Connected via $h"
              ok=1
              break
            fi
            rm -f work/backup.dump
          done
          [[ $ok == 1 ]] || { echo "::error::pg_dump failed on all hosts"; exit 1; }
          test -s work/backup.dump
          age -r "$AGE_RECIPIENT" -o "out/$filename" work/backup.dump
          test -s "out/$filename"
          rm -rf work
      - name: Store encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ matrix.project }}
          path: out/
          retention-days: 90
          if-no-files-found: error
