name: Supabase table security guard
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check_table_security.py'
      - '.github/workflows/table-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check_table_security.py'
permissions:
  contents: read
jobs:
  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Run existing app tests
        run: |
          node test/logic.test.js
          node test/smoke.test.js
      - name: Test unsafe migration detection
        run: python -m unittest discover -s scripts -p 'test_table_security.py' -v
      - name: Check table security controls
        run: python scripts/check_table_security.py
