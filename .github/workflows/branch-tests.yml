name: Lebenscockpit tests
on:
  push:
    branches:
      - 'claude/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Logic tests
        run: node test/logic.test.js
      - name: Smoke tests
        run: node test/smoke.test.js
      - name: Calendar draft tests
        run: node test/calendar-draft.test.js
      - name: SQL contract checks
        run: node test/sql-contract.test.js
      - name: Receipt export security tests
        run: node --test test/belege-*.test.mjs
