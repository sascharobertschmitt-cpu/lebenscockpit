name: Lebenscockpit Tests

on:
  push:
    branches: [main, "chore/phase0-tests"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finanzlogik testen
        run: node test/logic.test.js
      - name: Grenzfälle testen
        run: node test/edge.test.js
      - name: Oberfläche testen
        run: node test/smoke.test.js

  database-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: lebenscockpit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: testonly
      PGDATABASE: lebenscockpit_test
    steps:
      - uses: actions/checkout@v4
      - name: Testtabellen anlegen
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.posten (id uuid PRIMARY KEY);
          CREATE TABLE public.posten_zahlungen (
            id uuid PRIMARY KEY,
            posten_id uuid NOT NULL,
            CONSTRAINT posten_zahlungen_posten_id_fkey
              FOREIGN KEY (posten_id) REFERENCES public.posten(id) ON DELETE CASCADE
          );
          INSERT INTO public.posten VALUES
            ('00000000-0000-0000-0000-000000000001'),
            ('00000000-0000-0000-0000-000000000002');
          INSERT INTO public.posten_zahlungen VALUES
            ('00000000-0000-0000-0000-000000000003',
             '00000000-0000-0000-0000-000000000001');
          SQL
      - name: Historien-Schutzmigration anwenden
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114110000_protect_payment_history.sql
      - name: Berechtigungen der API-Rollen absichern (TRUNCATE & Co.)
        run: |
          createdb lebenscockpit_privs
          psql -v ON_ERROR_STOP=1 -d lebenscockpit_privs -f test/db/truncate_privileges.sql
      - name: Löschen mit Historie muss scheitern
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            BEGIN
              DELETE FROM public.posten WHERE id='00000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'Löschen mit Historie wurde nicht verhindert';
            EXCEPTION WHEN foreign_key_violation THEN
              NULL;
            END;
            IF (SELECT count(*) FROM public.posten_zahlungen) <> 1 THEN
              RAISE EXCEPTION 'Zahlungshistorie verändert';
            END IF;
            DELETE FROM public.posten WHERE id='00000000-0000-0000-0000-000000000002';
            IF EXISTS (SELECT 1 FROM public.posten WHERE id='00000000-0000-0000-0000-000000000002') THEN
              RAISE EXCEPTION 'Löschen ohne Historie fehlgeschlagen';
            END IF;
          END $$;
          SQL

      - name: Isolierte Backup-Wiederherstellung mit synthetischen Daten
        run: |
          set -euo pipefail
          # Ausschliesslich synthetische CI-Daten. Kein Zugriff auf Supabase-Produktion.
          docker run --rm --network host -e PGHOST=127.0.0.1 -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -v "$RUNNER_TEMP:/backup" postgres:17 pg_dump --format=custom --no-owner --no-acl --schema=public --file=/backup/lebenscockpit-ci.dump
          test -s "$RUNNER_TEMP/lebenscockpit-ci.dump"
          createdb lebenscockpit_restore
          docker run --rm --network host -e PGHOST=127.0.0.1 -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -v "$RUNNER_TEMP:/backup" postgres:17 pg_restore --exit-on-error --no-owner --no-acl -d lebenscockpit_restore /backup/lebenscockpit-ci.dump
          psql -v ON_ERROR_STOP=1 -d lebenscockpit_restore <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.posten) <> 1
               OR (SELECT count(*) FROM public.posten_zahlungen) <> 1 THEN
              RAISE EXCEPTION 'Backup-Restore: Anzahl der Datensaetze weicht ab';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'posten_zahlungen_posten_id_fkey'
                AND confdeltype = 'r'
            ) THEN
              RAISE EXCEPTION 'Backup-Restore: Schutz der Zahlungshistorie fehlt';
            END IF;
            BEGIN
              DELETE FROM public.posten
              WHERE id = '00000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'Backup-Restore: Historie wurde geloescht';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            IF (SELECT count(*) FROM public.posten_zahlungen) <> 1 THEN
              RAISE EXCEPTION 'Backup-Restore: Zahlungsdatensatz fehlt';
            END IF;
          END $$;
          SQL
          rm -f "$RUNNER_TEMP/lebenscockpit-ci.dump"
